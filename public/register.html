<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
    <link href="css/cards.css" rel="stylesheet" />
    <link href="css/modals.css" rel="stylesheet" />
    <link href="css/toast.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <!-- Navbar -->
    <div id="navbar"></div>
    <main class="py-5 page-shell">
      <div class="container">
        <div class="row justify-content-center mt-4">
          <div class="col-md-8 col-lg-6">
            <!-- Register card -->
            <div class="auth-card glass-card">
              <h3 class="mb-3 text-center">Join the Realm</h3>
              <p class="text-center auth-subtitle">Create your commander profile and first city.</p>
              <form id="signupForm">
                <div class="form-group mb-3">
                  <label for="username">Username</label>
                  <input type="text" class="form-control" id="username" required>
                </div>
                <div class="form-group mb-3">
                  <label for="city_name">Your First City Name</label>
                  <input type="text" class="form-control" id="city_name" required>
                </div>
                <div class="form-group mb-3">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" id="password" required>
                </div>
                <div class="form-group mb-4">
                  <label for="confirmPassword">Confirm Password</label>
                  <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Signup</button>
              </form>
              <!-- Registration error message -->
              <div id="warningCard" class="card border-danger mt-3 mb-0 d-none">
                <div class="card-body text-danger">
                  <p id="warningText" class="card-text"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-auto py-3 text-center">
      <p class="m-0 footer-note">Conquest of Paradise -- CA2 Project, For Learning Purposes</p>
    </footer>

    <script src="./js/navBar.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
      integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
      crossorigin="anonymous"
    ></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
    <script src="js/registerUser.js" type="text/javascript"></script>
  </body>
</html>
