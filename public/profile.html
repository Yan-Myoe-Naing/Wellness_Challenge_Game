<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400..700&family=VT323&display=swap" rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
    <link href="css/cards.css" rel="stylesheet" />
    <link href="css/modals.css" rel="stylesheet" />
    <link href="css/toast.css" rel="stylesheet" />
  </head>
  <body class="profile-page">
    <!-- Navbar -->
    <div id="navbar"></div>

    <main class="py-4 page-shell">
      <div class="container mb-4">
        <!-- Profile summary card -->
        <div class="profile-card glass-card text-center">
          <img
            id="profileIcon"
            class="profile-icon mb-3"
            src="https://raw.githubusercontent.com/YanMyoeNaing/website_assets/main/profileIcon.gif"
            alt="Profile icon"
          />
          <h2 class="welcome-title mb-2">Your Profile</h2>
          <div class="profile-meta">
            <p class="mb-1 d-flex align-items-center justify-content-center gap-2">
              Username:
              <span id="profileUsername">Loading...</span>
              <button type="button" class="btn btn-sm btn-outline-light" id="editUsernameBtn" aria-label="Edit username">
                ✎
              </button>
            </p>
            <p class="mb-0">User ID: <span id="profileUserId">Loading...</span></p>
            <p class="mb-0">Points: <span id="profilePoints">Loading...</span></p>
          </div>
        </div>
      </div>

      <div class="container mt-3">
        <!-- Profile tabs -->
        <ul class="nav nav-tabs justify-content-center profile-tabs" id="profileTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="cities-tab"
              data-bs-toggle="tab"
              data-bs-target="#cities-panel"
              type="button"
              role="tab"
              aria-controls="cities-panel"
              aria-selected="true"
            >
              Cities
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="diplomacies-tab"
              data-bs-toggle="tab"
              data-bs-target="#diplomacies-panel"
              type="button"
              role="tab"
              aria-controls="diplomacies-panel"
              aria-selected="false"
            >
              Diplomacies
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="pending-tab"
              data-bs-toggle="tab"
              data-bs-target="#pending-panel"
              type="button"
              role="tab"
              aria-controls="pending-panel"
              aria-selected="false"
            >
              Pending Requests
            </button>
          </li>
        </ul>

        <!-- Tab panels -->
        <div class="tab-content pt-4">
          <div
            class="tab-pane fade show active panel-shell"
            id="cities-panel"
            role="tabpanel"
            aria-labelledby="cities-tab"
          >
            <h2 class="mb-4 text-center">Your Cities</h2>
            <div id="cityList" class="row cards-grid"></div>
          </div>
          <div
            class="tab-pane fade panel-shell"
            id="diplomacies-panel"
            role="tabpanel"
            aria-labelledby="diplomacies-tab"
          >
            <h2 class="mb-3 text-center">Diplomacies</h2>
            <div id="diplomacyList" class="row cards-grid"></div>
          </div>
          <div
            class="tab-pane fade panel-shell"
            id="pending-panel"
            role="tabpanel"
            aria-labelledby="pending-tab"
          >
            <h2 class="mb-3 text-center">Pending Diplomacy Requests</h2>
            <div id="pendingDiplomacyList" class="row cards-grid"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-auto py-3 text-center">
      <p class="m-0 footer-note">Conquest of Paradise -- CA2 Project, For Learning Purposes</p>
    </footer>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="actionToast"
        class="toast align-items-center text-bg-dark border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="actionToastBody"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>



    <script src="js/navBar.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
      integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
      crossorigin="anonymous"
    ></script>
    <script src="js/toast.js" type="text/javascript"></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
    <script src="js/pageInit.js" type="text/javascript"></script>
    <script src="js/modal.js" type="text/javascript"></script>
    <script src="js/profile.js" type="text/javascript"></script>
  </body>
</html>
