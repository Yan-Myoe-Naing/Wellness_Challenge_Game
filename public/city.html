<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cities</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400..700&family=VT323&display=swap" rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
    <link href="css/cards.css" rel="stylesheet" />
    <link href="css/modals.css" rel="stylesheet" />
    <link href="css/toast.css" rel="stylesheet" />
    <link href="css/alert.css" rel="stylesheet" />
  </head>
  <body class="city-page">
    <div id="navbar"></div>

    <main class="py-5">
      <div class="container">
        <section class="challenge-hero glass-card mb-5">
          <div class="row align-items-center">
            <div class="col-lg-7">
              <h1 class="challenge-title">Cities</h1>
              <p class="challenge-subtitle">
                Explore all cities and engage in battles when diplomacy allows.
              </p>
            </div>
            <div class="col-lg-5 text-lg-end mt-4 mt-lg-0">
              <div class="challenge-stats">
                <div>
                  <p class="stat-label mb-1">Your Cities</p>
                  <p class="stat-value" id="myCityCount">--</p>
                </div>
                <div>
                  <p class="stat-label mb-1">Battleable Cities</p>
                  <p class="stat-value" id="battleableCount">--</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <ul class="nav nav-tabs justify-content-center profile-tabs mb-4" id="cityTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="all-tab"
              data-bs-toggle="tab"
              data-bs-target="#all-panel"
              type="button"
              role="tab"
              aria-controls="all-panel"
              aria-selected="true"
            >
              All Cities
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="battle-tab"
              data-bs-toggle="tab"
              data-bs-target="#battle-panel"
              type="button"
              role="tab"
              aria-controls="battle-panel"
              aria-selected="false"
            >
              Battling
            </button>
          </li>
        </ul>

        <div class="tab-content pb-4">
          <div
            class="tab-pane fade show active"
            id="all-panel"
            role="tabpanel"
            aria-labelledby="all-tab"
          >
            <div id="cityList" class="row"></div>
          </div>
          <div
            class="tab-pane fade"
            id="battle-panel"
            role="tabpanel"
            aria-labelledby="battle-tab"
          >
            <div id="battleList" class="row"></div>
          </div>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="battleModal"
      tabindex="-1"
      aria-labelledby="battleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="battleModalLabel">Choose Attacker Army</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="battleForm">
              <input type="hidden" id="battleDefenderArmyId" />
              <input type="hidden" id="battleAction" />
              <div class="mb-3">
                <label for="attackerArmySelect" class="form-label">Army (Army ID / City ID)</label>
                <select id="attackerArmySelect" class="form-select form-select-sm" required></select>
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary btn-sm">Attack</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="alertOverlay" class="alert-overlay">
      <div class="alert-box">
        <h4 class="alert-title" id="alertTitle">Notice</h4>
        <p class="alert-message" id="alertMessage"></p>
        <div class="alert-actions">
          <button type="button" class="btn btn-primary btn-sm" id="alertClose">OK</button>
        </div>
      </div>
    </div>

    <footer class="mt-auto py-3 text-center">
      <p class="m-0">Conquest of Paradise â€” CA2 Project, For Learning Purposes</p>
    </footer>

    <script src="./js/navBar.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
      integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
      crossorigin="anonymous"
    ></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
    <script src="js/alert.js" type="text/javascript"></script>
    <script src="js/modal.js" type="text/javascript"></script>
    <script src="js/city.js" type="text/javascript"></script>
  </body>
</html>
